spring.application.name=careerpilot-backend

# Optional local settings file (NOT committed). Copy .env.example to .env and edit it.
spring.config.import=optional:file:.env[.properties]

# ---- Database (MySQL). Credentials come from environment variables / .env ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careerpilot_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# "update" only adds missing tables/columns. It never drops existing data.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

server.port=${PORT:8080}

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# ---- CORS (comma separated origin patterns) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.app.github.dev}

# ---- Optional e-mail (disabled unless MAIL_ENABLED=true) ----
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@careerpilot.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
